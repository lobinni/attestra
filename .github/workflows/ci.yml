name: ci

on:
  push:
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      GENVM_VERSION: "v0.3.0-rc7"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/genvm-linter
            ~/.cache/gltest-direct
          key: genvm-${{ env.GENVM_VERSION }}-${{ runner.os }}
      - name: Install the pinned GenVM runner
        run: python scripts/fetch_genvm_bundle.py
      - name: Validate the deployable contract
        run: genvm-lint check contracts/attestra.py
      - name: Execute the contract in direct GenVM
        run: gltest tests/direct -q

  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Verify canonical StudioNet deployment
        run: npm run verify:live
      - run: npx next typegen
      - run: npm exec tsc -- --noEmit --pretty false
      - run: npm run lint
      - run: npm run build
